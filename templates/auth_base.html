{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-body">

<div class="auth-blob blob-1"></div>
<div class="auth-blob blob-2"></div>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-icon"><i class="bi bi-wallet2"></i></span>
      <span class="brand-text">Spend<em>Wise</em></span>
    </div>
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} py-2 small">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>
  <p class="auth-foot">Smart Expense Tracker · Django Mini Project</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ═══════════════════════════════════════════════════════════
     👁️ GUARANTEED EYE TOGGLE — Inline fallback script
     This runs even if app.js fails to load.
     ═══════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  function bindEyes() {
    var buttons = document.querySelectorAll('.eye-toggle');
    console.log('[SpendWise inline] Binding', buttons.length, 'eye toggle(s)');

    buttons.forEach(function (btn) {
      if (btn.dataset.eyeBoundInline === '1') return;
      btn.dataset.eyeBoundInline = '1';

      btn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();

        var input = null;

        // Try data-target
        var sel = btn.getAttribute('data-target');
        if (sel) {
          try { input = document.querySelector(sel); } catch (err) {}
        }

        // Try data-field-name
        if (!input) {
          var name = btn.getAttribute('data-field-name');
          if (name) input = document.querySelector('input[name="' + name + '"]');
        }

        // Try sibling input
        if (!input && btn.parentElement) {
          input = btn.parentElement.querySelector('input');
        }

        if (!input) {
          console.warn('[SpendWise] Eye toggle: input missing');
          return;
        }

        var isPass = input.type === 'password';
        input.type = isPass ? 'text' : 'password';

        var icon = btn.querySelector('i');
        if (icon) {
          icon.className = isPass ? 'bi bi-eye-slash' : 'bi bi-eye';
        }
        btn.classList.toggle('active', isPass);

        input.focus();
        try {
          var len = input.value.length;
          input.setSelectionRange(len, len);
        } catch (err) {}
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bindEyes);
  } else {
    bindEyes();
  }
  setTimeout(bindEyes, 400);
  setTimeout(bindEyes, 1200);
})();
</script>

</body>
</html>
